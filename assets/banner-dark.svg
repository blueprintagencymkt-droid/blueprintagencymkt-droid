<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">BluePrint · Visão estratégica com alma criativa.</title>
<desc id="d">Branding, Design Thinking e Arquitetura para franquias. Curitiba, PR.</desc>
<defs>
  <pattern id="g" width="21" height="21" patternUnits="userSpaceOnUse">
    <path d="M21 0H0V21" fill="none" stroke="#22476c" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#071a2e" stop-opacity="1"/>
    <stop offset=".52" stop-color="#071a2e" stop-opacity="1"/>
    <stop offset=".64" stop-color="#071a2e" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="l1"><rect x="40" y="118" width="760" height="76"/></clipPath>
  <clipPath id="l2"><rect x="40" y="194" width="760" height="76"/></clipPath>
</defs>
<style>
  .mono { font-family: "IBM Plex Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
  .lab  { font-size: 13px; letter-spacing: .08em; fill: #9db3c6; }
  .disp { font-size: 66px; font-weight: 800; letter-spacing: -.03em; fill: #eaf2f8; }
  .mark { fill: #0085ca; }
  .dim  { stroke: #4db3e6; stroke-width: 1.5; fill: none; }
  .dimt { font-size: 12px; letter-spacing: .08em; fill: #4db3e6; }

  /* gesto-assinatura: o retângulo cresce da esquerda (1s, expo.out)
     e o corte se abre de cima para baixo (0,618s, power3.inOut) */
  .grow { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1s cubic-bezier(.19,1,.22,1) .2s both; }
  .cut  { transform-box: fill-box; transform-origin: 50% 100%; animation: cut .618s cubic-bezier(.645,.045,.355,1) 1.2s both; }
  .rise { animation: rise .618s cubic-bezier(.19,1,.22,1) both; }
  .r1 { animation-delay: .382s; } .r2 { animation-delay: .5s; }
  .in { animation: fade .618s cubic-bezier(.19,1,.22,1) both; }
  .i1 { animation-delay: .9s; } .i2 { animation-delay: 1.82s; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes cut  { from { transform: scaleY(1); } to { transform: scaleY(0); } }
  @keyframes rise { from { transform: translateY(80px); } to { transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .grow, .cut, .rise, .in { animation: none; }
    .cut { display: none; }
  }
</style>

<rect width="1280" height="400" fill="#071a2e"/>
<rect width="1280" height="400" fill="url(#g)"/>
<rect width="1280" height="400" fill="url(#fade)"/>
<line x1="0" y1="399.5" x2="1280" y2="399.5" stroke="#6f8ea9"/>

<text class="mono lab in" x="55" y="89">REF. BP-GH · CURITIBA · PR</text>
<text class="mono lab in" x="1225" y="55" text-anchor="end">FOLHA 01/01 · ESCALA 1 : 1,618</text>

<g clip-path="url(#l1)"><text class="sans disp rise r1" x="52" y="176">Visão estratégica</text></g>
<g clip-path="url(#l2)"><text class="sans disp rise r2" x="52" y="252">com alma criativa.</text></g>

<g class="in i1">
  <text class="mono lab" x="55" y="312">BRANDING · DESIGN THINKING · ARQUITETURA</text>
  <text class="mono" x="55" y="346" font-size="15" fill="#4db3e6">blueprintlabs.space</text>
</g>

<g class="grow">
  <rect class="mark" x="880" y="104" width="176.4" height="180"/>
  <rect class="mark" x="1063.6" y="104" width="107.64" height="180"/>
  <rect class="mark cut" x="1055.8" y="104" width="8.4" height="180"/>
</g>

<g class="in i2">
  <path class="dim" d="M880 318H1171.24 M880 310V326 M1171.24 310V326"/>
  <path class="dim" d="M846 104V284 M838 104H854 M838 284H854"/>
  <rect x="996.62" y="309" width="58" height="18" fill="#071a2e" stroke="#4db3e6"/>
  <text class="mono dimt" x="1025.62" y="322" text-anchor="middle">1,618</text>
  <rect x="835" y="185.0" width="22" height="18" fill="#071a2e" stroke="#4db3e6"/>
  <text class="mono dimt" x="846" y="198.0" text-anchor="middle">1</text>
</g>
</svg>
